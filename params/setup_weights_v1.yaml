# params/setup_weights_v1.yaml — §9.5 + Ch.10 Setup Engine.
# FROZEN_BOOTSTRAP setup weights (sum = 1; do not retune in code), the only
# Wave-In family, and the fixed penalty constants (versioned params).
family_id: SF_FVG_SWEEP_REV
playbook_id: PB_FVG_SWEEP_REV_A
Q_min_setup: 0.55
gate7_entropy_threshold: 0.85
conflict_penalty: 0.4
redundancy_penalty: 0.3
redundancy_rho_threshold: 0.85
redundancy_window_n: 48
weights:
  w_structure: 0.16
  w_liquidity: 0.12
  w_volume: 0.10
  w_volatility: 0.08
  w_fvg: 0.12
  w_orderblock: 0.10
  w_rtm: 0.06
  w_wyckoff: 0.06
  w_trend: 0.08
  w_momentum: 0.06
  w_regime: 0.04
  w_temporal: 0.02
# --- CP-6 additions (ADR-P2-003, logged in DECISION_LOG §B/CP-6) ---------
# Context-layer governed scalars for apex/fabric. Bands + decay laws are
# governed parameters (SL-12); the propagation decision stays the Ch.8 §8.0
# threshold table, the band grid is the operational classification of the
# same scalar (ISSUE-CP6-002).
context_bands: {admissible: 0.70, confirmatory: 0.50, collapsed: 0.30}
propagation_confirmatory_threshold: 0.40
data_trust_floor: 0.30
context_decay_per_bar: 0.05
evidence_decay_per_bar: 0.02
# Setup hard-gate thresholds (Ch.10 §10.1). Gates 1–4/7/12 are score gates on
# the frozen [0,1] scale, quantized at 0.01 (the "±1 unit" of the gate matrix);
# Gates 8/9 are quality-class gates (Q0..Q5, one Q-class = 1 unit).
gate_score_unit: 0.01
gate_quality_min_class: 2
gate_forecast_q_min: 0.5
family_s_struct_min: 0.55
# D59 ج۷: engines structurally able to contribute to SF_FVG_SWEEP_REV.
# Required evidence maps to structure+liquidity+fvg+trend+regime+temporal (0.54).
# Optional evidence adds orderblock+momentum. Family mass = 0.70, the Q_setup denominator.
family_engines:
  - structure
  - liquidity
  - fvg
  - trend
  - regime
  - temporal
  - orderblock
  - momentum
# D63 option A: every E11 class except CRISIS. Blueprint line 15552 says SHOCK,
# which is not in the nine-class E11 registry; D63 defines that exclusion as CRISIS.
regime_window:
  - TRANSITION
  - EXPANSION
  - TREND_EXPANSION
  - TREND_CONTRACTION
  - TREND
  - COMPRESSION
  - CHOP
  - RANGE
