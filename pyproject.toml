[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-gen5"
version = "4.0.0"
description = "APEX_GEN5 — frozen-blueprint trading system (APEX_GEN5.md). Runtime dependencies are EXACTLY the nine SBOM pins of Ch.1 (requirements.lock); pytest is dev-only (ADR-P2-002)."
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.9.5",
    "aiogram==3.7.0",
    "aiosqlite==0.20.0",
    "matplotlib==3.8.4",
    "pandas==2.2.0",
    "numpy==1.26.0",
    "pydantic==2.5.0",
    "python-dateutil==2.8.2",
    "pytz==2024.1",
]

[project.optional-dependencies]
# pytest is permitted ONLY as a dev/test extra (ADR-P2-002). It never enters
# requirements.lock and is never imported by apex/** runtime code.
tests = ["pytest>=7,<9"]

[tool.setuptools]
packages = ["apex"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
